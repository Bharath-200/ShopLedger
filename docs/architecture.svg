<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">Verified source modules, HTTP routing, storage, independent invoice calculation, and nine numbered steps for placing an order. Orange identifies the invoice ticket module. All functions and file names were checked in source.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b45309"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#243247}
      .title{font-size:26px;font-weight:700;fill:#10243a}
      .section{font-size:14px;font-weight:700;fill:#334155}
      .name{font-size:15px;font-weight:700;fill:#10243a}
      .muted{fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.2;rx:9}
      .router{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.2;rx:9}
      .ticket{fill:#fff1db;stroke:#b45309;stroke-width:2;rx:9}
      .edge{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
      .invoice-edge{fill:none;stroke:#b45309;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#orange)}
      .num{fill:#1d4ed8;font-weight:700;font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#f8fafc"/>
  <text x="24" y="34" class="title">ShopLedger · source architecture</text>
  <text x="24" y="55" class="muted">Node / Express POS, inventory, Khata credit ledger and printable GST invoices</text>
  <rect x="887" y="23" width="16" height="13" class="ticket"/>
  <text x="911" y="35">Ticket: invoice.js</text>
  <path d="M1042 30H1073" class="invoice-edge"/>
  <text x="1081" y="35">Invoice path</text>

  <!-- HTTP entry and shared configuration -->
  <rect x="24" y="78" width="290" height="100" class="box"/>
  <text x="38" y="101" class="name">Browser UI · public/</text>
  <text x="38" y="122">index.html · js/app.js · css/style.css</text>
  <text x="38" y="143">getSelectedCartItems() · post()</text>
  <text x="38" y="164">POS, order history, Khata, GST audit</text>
  <path d="M314 125H360" class="edge"/>
  <text x="322" y="114">HTTP</text>
  <rect x="370" y="78" width="445" height="100" class="box"/>
  <text x="384" y="101" class="name">server.js · Express app</text>
  <text x="384" y="122">bodyParser.json() · express.static(public/)</text>
  <text x="384" y="143">app.use('/api', …) mounts all four routers</text>
  <text x="384" y="164">GET /orders/:id/invoice → read() → get() → render()</text>
  <rect x="850" y="78" width="326" height="100" class="box"/>
  <text x="864" y="101" class="name">config.js</text>
  <text x="864" y="122">Port, shop, adminKey, coupons, GST slabs</text>
  <text x="864" y="143">Required by server, routes/reports, and lib/</text>
  <text x="864" y="164">inventory, coupons, tax, invoice</text>

  <!-- Server dispatch bus: only mounted routers -->
  <path d="M590 178V196H164V215 M590 196H454V215 M590 196H744V215 M590 196H1034V215" class="edge"/>
  <path d="M164 196V215 M454 196V215 M744 196V215" class="edge"/>
  <text x="24" y="206" class="section">HTTP routers</text>
  <rect x="24" y="218" width="278" height="98" class="router"/>
  <text x="38" y="240" class="name">routes/products.js</text>
  <text x="38" y="260">GET /products · GET /coupons</text>
  <text x="38" y="282">Uses lib/: store, inventory, tax, coupons</text>
  <rect x="314" y="218" width="278" height="98" class="router"/>
  <text x="328" y="240" class="name">routes/orders.js</text>
  <text x="328" y="260">GET /orders, /orders/:id · POST /orders</text>
  <text x="328" y="277">POST /orders/:id/cancel</text>
  <text x="328" y="294">Uses store, inventory, pricing,</text>
  <text x="328" y="309">coupons, orders, ledger from lib/</text>
  <rect x="604" y="218" width="278" height="98" class="router"/>
  <text x="618" y="240" class="name">routes/customers.js</text>
  <text x="618" y="260">GET /customers</text>
  <text x="618" y="277">POST /customers/:id/settle</text>
  <text x="618" y="299">Uses lib/: store, ledger</text>
  <rect x="894" y="218" width="282" height="98" class="router"/>
  <text x="908" y="240" class="name">routes/reports.js</text>
  <text x="908" y="260">GET /reports/dashboard,</text>
  <text x="908" y="276">/reports/gst-reconciliation, /admin/export</text>
  <text x="908" y="292">POST /pricing/preview</text>
  <text x="908" y="309">Uses lib/: store, reports, pricing, coupons</text>
  <text x="24" y="340" class="section">Business modules · lib/</text>
  <text x="268" y="340" class="muted">Router cards list direct lib/ dependencies; internal calls appear below.</text>

  <!-- All ten lib modules, arranged as a module map rather than an all-to-all bus -->
  <rect x="24" y="352" width="220" height="77" class="box"/>
  <text x="36" y="374" class="name">lib/inventory.js</text>
  <text x="36" y="394">find() · check() · reserve()</text>
  <text x="36" y="414">release() · summarize()</text>
  <rect x="257" y="352" width="220" height="77" class="box"/>
  <text x="269" y="374" class="name">lib/pricing.js</text>
  <text x="269" y="394">subtotal() · computeTotals()</text>
  <text x="269" y="414">Calls coupons + tax</text>
  <rect x="490" y="352" width="220" height="77" class="box"/>
  <text x="502" y="374" class="name">lib/coupons.js</text>
  <text x="502" y="394">normalizeCode() · validate()</text>
  <text x="502" y="414">calculateDiscount() · listActive()</text>
  <rect x="723" y="352" width="220" height="77" class="box"/>
  <text x="735" y="374" class="name">lib/tax.js</text>
  <text x="735" y="394">getRateForItem() · getSlabPercent()</text>
  <text x="735" y="414">splitCgstSgst() · HSN lookup</text>
  <rect x="956" y="352" width="220" height="77" class="ticket"/>
  <text x="968" y="374" class="name">lib/invoice.js · ticket</text>
  <text x="968" y="394">computeInvoiceFigures() · render()</text>
  <text x="968" y="414">Uses config; does not call tax.js</text>
  <path d="M815 156H1187V341H1065V351" class="invoice-edge"/>

  <rect x="24" y="443" width="220" height="77" class="box"/>
  <text x="36" y="465" class="name">lib/orders.js</text>
  <text x="36" y="485">add() · get() · list() · cancel()</text>
  <text x="36" y="505">Calls dates, inventory, ledger</text>
  <rect x="257" y="443" width="220" height="77" class="box"/>
  <text x="269" y="465" class="name">lib/ledger.js</text>
  <text x="269" y="485">chargeOrderToKhata()</text>
  <text x="269" y="505">recordSettlement() · calls dates</text>
  <rect x="490" y="443" width="220" height="77" class="box"/>
  <text x="502" y="465" class="name">lib/dates.js</text>
  <text x="502" y="485">today() · normalizeDateKey()</text>
  <text x="502" y="505">getFiscalYear()</text>
  <rect x="723" y="443" width="220" height="77" class="box"/>
  <text x="735" y="465" class="name">lib/store.js</text>
  <text x="735" y="485">read() · write() · appendAudit()</text>
  <text x="735" y="505">Synchronous JSON file storage</text>
  <rect x="956" y="443" width="220" height="77" class="box"/>
  <text x="968" y="465" class="name">lib/reports.js</text>
  <text x="968" y="485">getDashboardSummary()</text>
  <text x="968" y="501">getGstReconciliation()</text>
  <text x="968" y="516">Calls inventory, ledger, invoice</text>
  <path d="M1066 443V430" class="invoice-edge"/>

  <rect x="24" y="539" width="670" height="70" fill="#fff7ed" stroke="#fed7aa" rx="9"/>
  <text x="38" y="560" class="section">Two calculation paths in the existing code</text>
  <text x="38" y="580">Checkout: capped coupon before per-HSN GST. Invoice: default 18% when gstRate absent;</text>
  <text x="38" y="598">percentage coupon after GST, without cap/minimum checks. Reports compare the results.</text>
  <path d="M833 520V539" class="edge"/>
  <path d="M850 539V520" class="edge"/>
  <rect x="723" y="542" width="453" height="67" class="box"/>
  <text x="737" y="563" class="name">data/db.json</text>
  <text x="737" y="583">products · orders · customers · settlements · auditLog</text>
  <text x="737" y="600">nextOrderId · nextSettlementId · whole-file read / write</text>

  <!-- Sequential order flow, read top-to-bottom in each column -->
  <rect x="24" y="625" width="1152" height="194" fill="#eef2f7" rx="10"/>
  <text x="38" y="648" class="section">Placing an order · read down each column, then continue →</text>
  <path d="M391 664V805 M785 664V805" stroke="#cbd5e1"/>
  <text x="38" y="677" class="num">1</text><text x="60" y="677">public/js/app.js: place button → post()</text>
  <text x="60" y="694">POST /api/orders → server.js → routes/orders.js</text>
  <text x="38" y="723" class="num">2</text><text x="60" y="723">store.read() → inventory.find(), check()</text>
  <text x="60" y="740">Resolve DB prices / HSN; parse qty; verify stock.</text>
  <text x="38" y="769" class="num">3</text><text x="60" y="769">pricing.subtotal() → coupons.normalizeCode()</text>
  <text x="60" y="786">→ coupons.validate(); reject invalid coupon.</text>
  <text x="406" y="677" class="num">4</text><text x="428" y="677">pricing.computeTotals() → coupons + tax</text>
  <text x="428" y="694">Discount allocation; GST slabs; rounded total.</text>
  <text x="406" y="723" class="num">5</text><text x="428" y="723">ledger.findCustomer(); if Khata:</text>
  <text x="428" y="740">chargeOrderToKhata() checks limit, updates due.</text>
  <text x="406" y="769" class="num">6</text><text x="428" y="769">inventory.reserve() → orders.add()</text>
  <text x="428" y="786">Deduct stock; nextOrderId++; date via today().</text>
  <text x="800" y="677" class="num">7</text><text x="822" y="677">store.appendAudit('ORDER_CREATED', …)</text>
  <text x="822" y="694">Record order ID, customer and total in audit.</text>
  <text x="800" y="723" class="num">8</text><text x="822" y="723">store.write(db) → data/db.json</text>
  <text x="822" y="740">Save stock, Khata changes, order, IDs, audit.</text>
  <text x="800" y="769" class="num">9</text><text x="822" y="769">res.status(201).json(order) → browser</text>
  <text x="822" y="786">Invoice link opens a separate GET request.</text>
  <text x="38" y="810" class="muted">Order stores subtotal, discount, tax, total; computed line tax breakdown and CGST / SGST split are not persisted.</text>
</svg>
